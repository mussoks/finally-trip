name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 매주 월요일 아침(한국 시간 06:23)에 공공데이터를 새로 받아 다시 배포해요.
  schedule:
    - cron: '23 21 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 저장소 Secret 에 DATA_GO_KR_KEY 가 없으면 이 단계는 건너뛰고, 앱은 내장 데이터로 배포돼요.
      - name: Fetch public data (TourAPI, 특일 정보)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: npm run fetch-data

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
